# 搜索渠道使用的关键词。query = 模板中 {category} 与 {footprint} 的组合。
# 搜索渠道默认关闭（见 settings.yaml），建议优先用浏览器插件在搜索结果页一键提取。

categories:
  - "home organization"
  - "kitchen gadgets"
  - "pet supplies"
  - "outdoor gear"
  - "car accessories"
  - "phone accessories"
  - "beauty tools"
  - "women's clothing"
  - "jewelry"
  - "toys"

footprints:
  - '"powered by shopify"'
  - '"City of Industry, CA"'
  - '"Ontario, CA 91761"'
  - '"Walnut, CA"'
  - '"Flushing, NY"'
  - '"Edison, NJ"'
  - '"shipping" "7-15 business days"'
  - '"shoplazza"'
  - '"shopline"'

templates:
  - '{category} store {footprint}'
  - '{category} {footprint} "contact us"'

# 这些域名永远不作为候选（平台、社媒、大型零售商等）
