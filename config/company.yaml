# 我方公司画像：LLM 会据此判断合作契合度。请按实际情况修改。

name: "（你的公司名）"
description: >
  跨境电商公司，在美国自有仓库，可为独立站卖家提供海外仓储、一件代发、
  退货处理等服务；同时希望将我方产品上架到合作独立站进行分销/代销。

warehouses:
  - location: "California, USA"   # 例：Ontario, CA
    services: ["仓储", "一件代发", "FBA 中转", "退货换标"]

# 我方可供上架的产品品类，越具体越好
product_categories:
  - "家居收纳"
  - "厨房用品"
  - "宠物用品"
  - "户外运动"
  - "汽车配件"

partnership_types:
  - "海外仓/一件代发服务"
  - "我方产品在对方独立站上架（分销/代销/批发）"

# 更偏好的合作对象（会写进提示词）
preferences:
  - "在美华人卖家优先，其次是国内跨境卖家"
  - "从中国直发、配送时效长的卖家，更需要海外仓"
  - "品类与我方产品相近或互补的站点，更适合上架合作"
  - "有一定体量（SKU 较多、持续上新、有广告投放）但不是大品牌的中小卖家"
